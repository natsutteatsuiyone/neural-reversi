[package]
name = "datagen"
version.workspace = true
edition.workspace = true

[features]
# Enables `endgame-trace`, which needs ProbCut tracing compiled into the engine.
trace = ["reversi-core/probcut-trace"]

[dependencies]
byteorder = "1.5.0"
clap = { version = "4", features = ["derive"] }
rand = "0.10"
indicatif = "0.18"
anyhow = "1.0"
glob = "0.3"
gethostname = "1.0"
reversi-core = { path = "../reversi-core" }
