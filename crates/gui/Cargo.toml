[package]
name = "gui"
version.workspace = true
description = "Neural Reversi native GPUI desktop application"
authors = ["natsutteatsuiyone"]
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit = { version = "=0.8.0", default-features = false, features = ["component"] }
reversi-core = { path = "../reversi-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
sys-locale = "0.3"
rust-i18n = "4"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
