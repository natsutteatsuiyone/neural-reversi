[package]
name = "gui"
description = "Neural Reversi native NSH desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
nsh-core = { version = "=0.7.2", features = ["svg"] }
nsh-base = { version = "=0.7.2", default-features = false }
base64 = "0.23"
reversi-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
sys-locale = "0.3"
rust-i18n = "4"

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.7.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.7.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.7.2", default-features = false }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
nsh-engine = { version = "=0.7.2", default-features = false }
nsh-testing = { version = "=0.7.2", default-features = false }

[lints]
workspace = true
