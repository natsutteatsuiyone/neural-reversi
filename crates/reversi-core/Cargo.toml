[package]
name = "reversi-core"
description = "Core Reversi search and neural-network evaluation engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
search-stats = []
# Records sampled endgame ProbCut decisions for model validation (datagen).
probcut-trace = []

[dependencies]
byteorder.workspace = true
eval-weights.workspace = true
rapidhash = { version = "4.4", features = ["unsafe"] }
zstd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[dev-dependencies]
criterion = "0.8"
rand.workspace = true

[[bench]]
name = "network"
harness = false

[[bench]]
name = "perft"
harness = false

[[bench]]
name = "bitboard"
harness = false

[lints]
workspace = true
