[workspace]
members = [
    "crates/cli",
    "crates/datagen",
    "crates/evaltest",
    "crates/gui",
    "crates/match-runner",
    "crates/reversi-core",
    "crates/web",
]
resolver = "2"

[workspace.package]
version = "6.3.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
lto = "thin"
