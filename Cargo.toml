[workspace]
members = [
    "crates/cli",
    "crates/datagen",
    "crates/gui",
    "crates/match-runner",
    "crates/reversi-core",
    "crates/search-test",
    "crates/web",
]
resolver = "3"

[workspace.package]
version = "6.3.0"
edition = "2024"
authors = ["natsutteatsuiyone"]
license = "GPL-3.0-or-later"
repository = "https://github.com/natsutteatsuiyone/neural-reversi"
homepage = "https://neural-reversi.net/"
publish = false

[workspace.dependencies]
byteorder = "1.5.0"
clap = { version = "4", features = ["derive"] }
colored = "3"
indicatif = "0.18"
num-format = "0.4"
rand = "0.10.1"
reversi-core = { path = "crates/reversi-core" }
windows-sys = "0.61.0"
zstd = "0.14.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
macro_use_imports = "warn"
missing_safety_doc = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
lto = "thin"
