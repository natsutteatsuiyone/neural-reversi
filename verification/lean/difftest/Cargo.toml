[package]
name = "flip-scalar-difftest"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "flip-scalar-difftest"

[features]
search-stats = []
weight-stream = ["dep:byteorder", "dep:zstd"]

[dependencies]
byteorder = { version = "=1.5.0", optional = true }
rapidhash = { version = "=4.5.1", features = ["unsafe"] }
zstd = { version = "=0.14.4", optional = true }

[[bin]]
name = "weight_stream_cases"
required-features = ["weight-stream"]

[workspace]
