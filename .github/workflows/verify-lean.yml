name: Verify Lean proofs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - verification/lean/**
      - verification/tla/lean-witnesses/*.lean
      - .github/workflows/verify-lean.yml
      - crates/eval-weights/**
      - crates/reversi-core/src/**
      - crates/reversi-core/build.rs
      - crates/reversi-core/Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  pull_request:
    branches: [ main ]
    paths:
      - verification/lean/**
      - verification/tla/lean-witnesses/*.lean
      - .github/workflows/verify-lean.yml
      - crates/eval-weights/**
      - crates/reversi-core/src/**
      - crates/reversi-core/build.rs
      - crates/reversi-core/Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'

    - name: Install elan
      run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
        echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
        sh "$RUNNER_TEMP/elan-init.sh" -y --no-modify-path --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Cache elan toolchains
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.elan/toolchains
        key: ${{ runner.os }}-elan-${{ hashFiles('verification/lean/lean-toolchain') }}

    - name: Cache Lean build artifacts
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: verification/lean/.lake
        key: ${{ runner.os }}-lean-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}-${{ hashFiles('verification/lean/**/*.lean') }}
        restore-keys: |
          ${{ runner.os }}-lean-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}-

    - name: Install Rust
      run: rustup toolchain install --no-self-update

    - name: Cache difftest Cargo artifacts
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target/verify-lean/target
          target/verify-lean/pattern-table-builder
        key: ${{ runner.os }}-difftest-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('verification/lean/difftest/Cargo.lock') }}-${{ hashFiles('verification/lean/difftest/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-difftest-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('verification/lean/difftest/Cargo.lock') }}-
          ${{ runner.os }}-difftest-${{ hashFiles('rust-toolchain.toml') }}-

    - name: Check the proofs, audits, and differential test
      run: python3 verification/lean/check.py
