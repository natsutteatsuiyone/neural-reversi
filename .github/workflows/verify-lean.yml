      - crates/reversi-core/src/util/align.rs
      - crates/reversi-core/src/util/aligned_buffer.rs
      - crates/reversi-core/src/util/large_pages.rs
      - crates/reversi-core/src/square.rs
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'

    - name: Install elan
      run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
        echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
        sh "$RUNNER_TEMP/elan-init.sh" -y --no-modify-path --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Cache Lean build artifacts
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: verification/lean/.lake
        key: ${{ runner.os }}-lean-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-lean-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}-

    - name: Install Rust
      run: rustup toolchain install --no-self-update

    - name: Check the proofs, audits, and differential test
      run: python3 verification/lean/check.py
