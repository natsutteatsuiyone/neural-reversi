name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Rust environment
      uses: $/.github/actions/setup-rust

    - name: Run tests
      run: cargo test --workspace --locked

  rust-test-x86-simd:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Rust environment
      uses: $/.github/actions/setup-rust
      with:
        cache-key: simd

    - name: Test with AVX2 tier (x86-64-v3)
      env:
        RUSTFLAGS: -C target-cpu=x86-64-v3
      run: cargo test -p reversi-core

    # Explicit --target keeps RUSTFLAGS off build scripts, which run on the
    # runner and would SIGILL if compiled with AVX-512 instructions.
    - name: Compile-check AVX-512 tier (x86-64-v4, not executed)
      env:
        RUSTFLAGS: -C target-cpu=x86-64-v4
      run: cargo check -p reversi-core --all-targets --target x86_64-unknown-linux-gnu

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Rust environment
      uses: $/.github/actions/setup-rust

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Doc check
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --no-deps --all-features --document-private-items
