name: Setup Rust environment
description: Install system dependencies, Rust toolchain, cache, and neural network weights

inputs:
  cache-key:
    description: Extra cache key for Swatinem/rust-cache
    default: ''

runs:
  using: composite
  steps:
  - name: Install Linux GPUI dependencies
    if: runner.os == 'Linux'
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        build-essential clang cmake pkg-config libclang-dev \
        libasound2-dev libfontconfig1-dev libfreetype6-dev libglib2.0-dev \
        libssl-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
        libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev

  # Installs the toolchain pinned in rust-toolchain.toml.
  - name: Install Rust
    shell: bash
    run: rustup toolchain install --no-self-update

  - name: Cache Rust dependencies
    uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    with:
      key: ${{ inputs.cache-key }}

  - name: Download weights
    shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      set -euo pipefail
      repo=natsutteatsuiyone/neural-reversi-weights
      names=$(grep -ohE 'eval(_sm|_wasm)?-[0-9a-f]{8}\.zst' \
        crates/reversi-core/src/eval.rs crates/web/src/eval.rs | sort -u)
      for name in $names; do
        # Releases are listed newest first.
        tags=$(gh api --paginate "repos/$repo/releases" \
          --jq ".[] | select(any(.assets[]; .name == \"$name\")) | .tag_name")
        tag=${tags%%$'\n'*}
        if [[ -z "$tag" ]]; then
          echo "::error::$name is not in any release of $repo"
          exit 1
        fi
        echo "Downloading $name from $tag"
        gh release download "$tag" -R "$repo" -p "$name" --clobber
      done

      ls -l eval*.zst
