env_scripts = [
'''
#!@duckscript
text = readfile Cargo.toml
pos = indexof ${text} "version = \""
len = strlen "version = \""
start = calc ${pos} + ${len}
rest = substring ${text} ${start}
end_pos = indexof ${rest} "\""
version = substring ${rest} 0 ${end_pos}
set_env VERSION ${version}
'''
]

[config]
default_to_workspace = false

# ───────────────────────────────────────────────────────────────
#  Development Tasks
# ───────────────────────────────────────────────────────────────

[tasks.check]
command = "cargo"
args = ["check", "--workspace"]

[tasks.test]
command = "cargo"
args = ["test", "--workspace"]

[tasks.test-x86-v3]
description = "Run reversi-core tests with x86-64-v3 (AVX2 tier) codegen"
command = "cargo"
args = ["test", "-p", "reversi-core", "--target", "${CARGO_MAKE_RUST_TARGET_TRIPLE}"]

[tasks.test-x86-v3.env]
RUSTFLAGS = "-C target-cpu=x86-64-v3"

[tasks.test-x86-v4]
description = "Run reversi-core tests with x86-64-v4 (AVX-512 tier) codegen. Requires an AVX-512 CPU; tests SIGILL otherwise."
command = "cargo"
args = ["test", "-p", "reversi-core", "--target", "${CARGO_MAKE_RUST_TARGET_TRIPLE}"]

[tasks.test-x86-v4.env]
RUSTFLAGS = "-C target-cpu=x86-64-v4"

[tasks.check-x86-v4]
description = "Compile-check all targets with x86-64-v4 codegen (safe on any host)"
command = "cargo"
args = ["check", "-p", "reversi-core", "--all-targets", "--target", "${CARGO_MAKE_RUST_TARGET_TRIPLE}"]

[tasks.check-x86-v4.env]
RUSTFLAGS = "-C target-cpu=x86-64-v4"

[tasks.clippy]
clear = true
command = "cargo"
args = [
    "clippy",
    "--workspace",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "warnings",
]

[tasks.fmt]
command = "cargo"
args = ["fmt"]

[tasks.fmt-check]
command = "cargo"
args = ["fmt", "--check"]

[tasks.doc-check]
description = "Build docs with warnings denied"
command = "cargo"
args = [
    "doc",
    "--workspace",
    "--no-deps",
    "--all-features",
    "--document-private-items",
]

[tasks.doc-check.env]
RUSTDOCFLAGS = "-D warnings"

[tasks.lint]
description = "Run fmt check, clippy, and doc check"
run_task = { name = ["fmt-check", "clippy", "doc-check"] }

[tasks.bench]
command = "cargo"
args = ["bench", "-p", "reversi-core"]

[tasks.licenses-cli]
description = "Regenerate crates/cli/THIRD_PARTY_LICENSES.txt via cargo-about"
command = "cargo"
args = [
    "about",
    "generate",
    "-m",
    "crates/cli/Cargo.toml",
    "-c",
    "about.toml",
    "about.hbs",
    "-o",
    "crates/cli/THIRD_PARTY_LICENSES.txt",
]

[tasks.licenses-gui]
description = "Regenerate crates/gui/THIRD_PARTY_LICENSES.txt via cargo-about"
command = "cargo"
args = [
    "about",
    "generate",
    "-m",
    "crates/gui/Cargo.toml",
    "-c",
    "about.toml",
    "about.hbs",
    "-o",
    "crates/gui/THIRD_PARTY_LICENSES.txt",
]

[tasks.licenses]
description = "Regenerate CLI and GUI THIRD_PARTY_LICENSES.txt bundles"
run_task = { name = ["licenses-cli", "licenses-gui"] }

[tasks.clean]
description = "Clean build artifacts and dist directory"
script_runner = "@duckscript"
script = [
    "exec --fail-on-error cargo clean",
    "dist_exists = is_path_exists dist",
    "if ${dist_exists}",
    "    rm -r dist",
    "end",
]

# ───────────────────────────────────────────────────────────────
#  Distribution Preparation
# ───────────────────────────────────────────────────────────────

[tasks.prepare-dist]
description = "Initialize distribution directory"
script_runner = "@duckscript"
script = [
    "dist_exists = is_path_exists dist",
    "if not ${dist_exists}",
    "    mkdir dist",
    "end",
]

[tasks.bundle-gui-macos]
description = "Bundle the native GUI as an ad-hoc signed macOS app and disk image"
script_runner = "bash"
script = '''
set -euo pipefail
stage="$GUI_BUNDLE_ROOT/target/gui-dmg"
app="$stage/Neural Reversi.app"
rm -rf "$stage"
mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
cp "$GUI_BUNDLE_BINARY" "$app/Contents/MacOS/gui"
cp "$GUI_BUNDLE_ROOT/crates/gui/assets/icon.icns" "$app/Contents/Resources/icon.icns"
cat > "$app/Contents/Info.plist" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
<key>CFBundleExecutable</key><string>gui</string>
<key>CFBundleIdentifier</key><string>com.neural-reversi.gui</string>
<key>CFBundleName</key><string>Neural Reversi</string>
<key>CFBundleDisplayName</key><string>Neural Reversi</string>
<key>CFBundlePackageType</key><string>APPL</string>
<key>CFBundleShortVersionString</key><string>$VERSION</string>
<key>CFBundleVersion</key><string>$VERSION</string>
<key>CFBundleIconFile</key><string>icon.icns</string>
<key>NSHighResolutionCapable</key><true/>
</dict></plist>
EOF
codesign --force --deep --sign - "$app"
ln -s /Applications "$stage/Applications"
ditto "$app" "$GUI_BUNDLE_ROOT/dist/Neural Reversi.app"
hdiutil create -volname "Neural Reversi" -srcfolder "$stage" -ov -format UDZO "$GUI_BUNDLE_DMG"
'''

# ═══════════════════════════════════════════════════════════════
#  Distribution Builds
# ═══════════════════════════════════════════════════════════════

[tasks.build-dist]
description = "Build distribution artifacts: build-dist <cli|gui|all> <windows|linux|macos|all> <portable|native|x86-64-v2|x86-64-v3|x86-64-v4|apple-m1>"
dependencies = ["prepare-dist"]
script_runner = "@duckscript"
script = [
    "usage = set \"Usage: cargo make build-dist <cli|gui|all> <windows|linux|macos|all> <portable|native|x86-64-v2|x86-64-v3|x86-64-v4|apple-m1>\"",
    "args = split ${CARGO_MAKE_TASK_ARGS} ;",
    "arg_count = array_length ${args}",
    "valid_arg_count = eq ${arg_count} 3",
    "if not ${valid_arg_count}",
    "    echo ${usage}",
    "    exit 2",
    "end",
    "build_selector = array_get ${args} 0",
    "platform_selector = array_get ${args} 1",
    "tier_selector = array_get ${args} 2",
    "",
    "if eq ${build_selector} all",
    "    build_types = array cli gui",
    "else",
    "    if eq ${build_selector} cli",
    "        build_types = array cli",
    "    else",
    "        if eq ${build_selector} gui",
    "            build_types = array gui",
    "        else",
    "            echo ${usage}",
    "            exit 2",
    "        end",
    "    end",
    "end",
    "",
    "if eq ${platform_selector} all",
    "    if eq ${tier_selector} portable",
    "        platforms = array windows linux macos",
    "    else",
    "        if eq ${tier_selector} native",
    "            platforms = array windows linux macos",
    "        else",
    "            echo ${usage}",
    "            exit 2",
    "        end",
    "    end",
    "else",
    "    if eq ${platform_selector} windows",
    "        platforms = array windows",
    "    else",
    "        if eq ${platform_selector} linux",
    "            platforms = array linux",
    "        else",
    "            if eq ${platform_selector} macos",
    "                platforms = array macos",
    "            else",
    "                echo ${usage}",
    "                exit 2",
    "            end",
    "        end",
    "    end",
    "end",
    "",
    "workspace_root = get_env CARGO_MAKE_CURRENT_TASK_INITIAL_MAKEFILE_DIRECTORY",
    "version = get_env VERSION",
    "for platform in ${platforms}",
    "    if eq ${platform} windows",
    "        target_triple = set x86_64-pc-windows-msvc",
    "        dest_ext = set .exe",
    "    else",
    "        if eq ${platform} linux",
    "            target_triple = set x86_64-unknown-linux-gnu",
    "            dest_ext = set \"\"",
    "        else",
    "            target_triple = set aarch64-apple-darwin",
    "            dest_ext = set \"\"",
    "        end",
    "    end",
    "",
    "    if eq ${tier_selector} portable",
    "        if eq ${platform} macos",
    "            tiers = array apple-m1",
    "        else",
    "            tiers = array x86-64-v2 x86-64-v3 x86-64-v4",
    "        end",
    "    else",
    "        tiers = array ${tier_selector}",
    "    end",
    "",
    "    for tier in ${tiers}",
    "        if eq ${tier} native",
    "            rust_tier = set native",
    "        else",
    "            if eq ${platform} macos",
    "                valid_tier = eq ${tier} apple-m1",
    "                if not ${valid_tier}",
    "                    echo ${usage}",
    "                    exit 2",
    "                end",
    "                rust_tier = set apple-m1",
    "            else",
    "                valid_tier = eq ${tier} x86-64-v2",
    "                if not ${valid_tier}",
    "                    valid_tier = eq ${tier} x86-64-v3",
    "                end",
    "                if not ${valid_tier}",
    "                    valid_tier = eq ${tier} x86-64-v4",
    "                end",
    "                if not ${valid_tier}",
    "                    echo ${usage}",
    "                    exit 2",
    "                end",
    "                rust_tier = set ${tier}",
    "            end",
    "        end",
    "",
    "        if eq ${platform} macos",
    "            if eq ${tier} native",
    "                filename_suffix = set macos-native",
    "            else",
    "                filename_suffix = set aarch64-apple-darwin",
    "            end",
    "        else",
    "            if eq ${tier} native",
    "                filename_suffix = concat ${platform} \"-native\"",
    "            else",
    "                tier_version = replace ${tier} \"x86-64-\" \"\"",
    "                if eq ${platform} windows",
    "                    filename_suffix = concat \"windows-x86_64-\" ${tier_version}",
    "                else",
    "                    filename_suffix = concat \"linux-x86_64_\" ${tier_version}",
    "                end",
    "            end",
    "        end",
    "",
    "        rustflags = concat \"-C target-cpu=\" ${rust_tier}",
    "        set_env RUSTFLAGS ${rustflags}",
    "        echo Building ${build_selector} ${platform} ${tier}...",
    "        for build_type in ${build_types}",
    "            if eq ${build_type} gui",
    "                exec --fail-on-error cargo build --release -p gui --bin gui --target ${target_triple}",
    "                binary_basename = set neural-reversi-gui",
    "                source_file = concat gui ${dest_ext}",
    "                source = join_path ${workspace_root} target ${target_triple} release ${source_file}",
    "                artifact_ext = set ${dest_ext}",
    "                if eq ${platform} macos",
    "                    dmg_name = concat neural-reversi-gui- ${version} - ${filename_suffix} .dmg",
    "                    dmg_path = join_path ${workspace_root} target ${dmg_name}",
    "                    set_env GUI_BUNDLE_ROOT ${workspace_root}",
    "                    set_env GUI_BUNDLE_BINARY ${source}",
    "                    set_env GUI_BUNDLE_DMG ${dmg_path}",
    "                    exec --fail-on-error cargo make bundle-gui-macos",
    "                    source = set ${dmg_path}",
    "                    artifact_ext = set .dmg",
    "                end",
    "            else",
    "                exec --fail-on-error cargo build --release -p cli --target ${target_triple}",
    "                binary_basename = set neural-reversi-cli",
    "                source_file = set cli",
    "                if eq ${platform} windows",
    "                    source_file = set cli.exe",
    "                end",
    "                source = join_path ${workspace_root} target ${target_triple} release ${source_file}",
    "                artifact_ext = set ${dest_ext}",
    "            end",
    "",
    "            dest_name = concat ${binary_basename} \"-\" ${version} \"-\" ${filename_suffix} ${artifact_ext}",
    "            dest = join_path ${workspace_root} dist ${dest_name}",
    "            cp ${source} ${dest}",
    "            echo ✓ Built: ${dest_name}",
    "        end",
    "        unset_env RUSTFLAGS",
    "    end",
    "end",
]
